<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Padārtha & Anvaya Podcasts</title>
  <meta name="description" content="Word-by-word (Padārtha) and sentence-level (Anvaya) meanings of Vedic mantras in clear English — via audio podcasts with transcription and summaries." />

  <!-- Docx -> HTML converter -->
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

  <style>
    :root{
      --bg1:#070914;
      --bg2:#0b1020;
      --card: rgba(255,255,255,0.07);
      --card2: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --shadow: 0 18px 60px rgba(0,0,0,0.48);
      --radius: 18px;
      --accent: rgba(155,231,255,0.16);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 20% 10%, rgba(155,231,255,0.18), transparent 58%),
        radial-gradient(1100px 700px at 85% 15%, rgba(185,255,218,0.12), transparent 58%),
        radial-gradient(900px 600px at 55% 90%, rgba(140,120,255,0.10), transparent 58%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 45%, var(--bg1));
      min-height:100vh;
    }

    .wrap{ max-width: 1150px; margin: 0 auto; padding: 26px 16px 50px; }

    /* Banner */
    .banner{
      display:flex;
      justify-content:center;
      margin: 6px 0 18px;
    }
    .banner img{
      width: min(100%, 980px);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display:block;
    }

    /* Controls row */
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:flex-end;
      justify-content:space-between;
      margin-bottom: 14px;
    }

    .leftControls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:flex-end;
    }

    .field{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 12px;
      display:flex;
      gap:10px;
      align-items:center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }
    .field label{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    select{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      outline:none;
      font-size: 14px;
      min-width: 210px;
    }
    select option{ background: #0b1020; }

    /* Toggle */
    .toggle{
      display:flex;
      gap:8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .toggle button{
      border:0;
      padding: 10px 12px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor:pointer;
      font-size: 13px;
      transition: 160ms ease;
      user-select:none;
    }
    .toggle button.active{
      background: var(--accent);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(155,231,255,0.22);
    }

    .status{
      color: var(--muted);
      font-size: 13px;
      padding: 0 4px 2px;
    }

    /* Main content cards */
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .episodeTitle{
      margin:0 0 6px;
      font-size: 18px;
      letter-spacing: 0.2px;
    }
    .episodeMeta{
      margin:0 0 12px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.35;
    }

    audio{
      width:100%;
      margin-top: 6px;
    }

    .docHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom: 10px;
    }
    .docHeader h3{
      margin:0;
      font-size: 16px;
    }
    .docHeader a{
      color: var(--text);
      font-size: 13px;
      opacity: 0.9;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      text-decoration:none;
    }
    .docHeader a:hover{ background: rgba(255,255,255,0.10); }

    .docBody{
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px;
      overflow:auto;
      max-height: 55vh;
    }

    /* Styling for converted docx HTML */
    .docBody p{ margin: 0 0 10px; line-height: 1.55; color: rgba(255,255,255,0.88); }
    .docBody h1, .docBody h2, .docBody h3{ margin: 14px 0 10px; }
    .docBody ul{ margin: 8px 0 12px 20px; }
    .docBody li{ margin: 4px 0; color: rgba(255,255,255,0.86); }
    .docBody blockquote{
      margin: 10px 0;
      padding: 10px 12px;
      border-left: 3px solid rgba(155,231,255,0.35);
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .footer{
      margin-top: 18px;
      text-align:center;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    .error{
      color: rgba(255,160,160,0.95);
      font-size: 13px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- Top Banner -->
    <div class="banner">
      <!-- Put your banner png in repo root with this exact name -->
      <img src="Vedam_Podcast_Page_Banner.png" alt="Vedam Podcast Banner">
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="leftControls">
        <div class="field">
          <label for="textSelect">Vedic Text</label>
          <select id="textSelect"></select>
        </div>

        <div class="field">
          <label for="dateSelect">Date</label>
          <select id="dateSelect"></select>
        </div>

        <div class="toggle" aria-label="Choose view">
          <button id="btnTranscription" class="active" type="button">Transcription</button>
          <button id="btnSummary" type="button">Podcast Summary</button>
        </div>
      </div>

      <div class="status" id="statusMsg">Ready.</div>
    </div>

    <!-- Main -->
    <div class="grid">
      <div class="card">
        <h2 class="episodeTitle" id="episodeTitle">Select an episode</h2>
        <p class="episodeMeta" id="episodeMeta">Choose a Vedic text and date to begin.</p>
        <audio id="audioPlayer" controls preload="metadata"></audio>
        <div class="error" id="audioError" style="display:none;"></div>
      </div>

      <div class="card">
        <div class="docHeader">
          <h3 id="docTitle">Transcription</h3>
          <a id="docDownload" href="#" download>Download</a>
        </div>
        <div class="docBody" id="docBody">
          Select an episode to load transcription/summary.
        </div>
        <div class="error" id="docError" style="display:none;"></div>
      </div>
    </div>

    <div class="footer">
      Built for Padārtha (word-by-word) & Anvaya (sentence meaning) learning • Hosted on GitHub Pages
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
