<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Veda Padārtha Anvaya Podcasts</title>

  <!-- DOCX → HTML converter -->
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

  <style>
    :root{
      --bg1:#070914;
      --bg2:#0b1020;
      --card: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --shadow: 0 18px 60px rgba(0,0,0,0.48);
      --radius: 18px;
      --accent: rgba(155,231,255,0.18);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 20% 10%, rgba(155,231,255,0.18), transparent 58%),
        radial-gradient(900px 600px at 80% 90%, rgba(140,120,255,0.10), transparent 58%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 45%, var(--bg1));
      min-height:100vh;
    }

    .wrap{
      max-width: 1150px;
      margin: 0 auto;
      padding: 18px 16px 50px;
    }

    /* Banner: full-width page banner */
    .banner{
      display:flex;
      justify-content:center;
      margin-bottom: 10px;
    }
    .bannerFrame{
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      overflow:hidden;
      background: rgba(255,255,255,0.03);
    }
    .bannerFrame img{
      width: 100%;
      height: 220px;      /* thin-ish banner */
      object-fit: cover;  /* fills width nicely */
      display:block;
    }

    /* Controls row: right under banner */
    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:12px;
      margin: 8px 0 8px;
    }

    .field{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 12px;
      display:flex;
      gap:10px;
      align-items:center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }

    .field label{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    select{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      min-width: 210px;
    }
    select option{ background:#0b1020; }

    /* Toggle */
    .toggle{
      display:flex;
      gap:6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      box-shadow: 0 8px 22px rgba(0,0,0,0.20);
      backdrop-filter: blur(12px);
    }
    .toggle button{
      border:0;
      padding: 9px 14px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor:pointer;
      font-size: 13px;
    }
    .toggle button.active{
      background: var(--accent);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(155,231,255,0.25);
    }

    /* Status line under controls */
    .statusRow{
      display:flex;
      justify-content:flex-end;
      margin: 0 0 12px;
    }
    .statusPill{
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 12.5px;
      max-width: 100%;
    }

    /* Cards */
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    /* Audio section */
    .episodeTitle{
      margin:0 0 6px;
      font-size: 18px;
    }
    .episodeMeta{
      margin:0 0 12px;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Use <video> for MP4 reliability but make it look like an audio player */
    #audioPlayer{
      width:100%;
      height: 56px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      outline: none;
    }

    /* Document */
    .docHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom: 10px;
      gap: 10px;
    }
    .docHeader h3{
      margin:0;
      font-size: 16px;
    }

    .docBody{
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px;
      max-height: 55vh;
      overflow:auto;
    }

    /* Better typography for converted DOCX */
    .docBody p{ margin:0 0 10px; line-height:1.6; color: rgba(255,255,255,0.88); }
    .docBody h1, .docBody h2, .docBody h3{ margin: 14px 0 10px; }
    .docBody ul{ margin: 8px 0 12px 20px; }
    .docBody li{ margin: 4px 0; color: rgba(255,255,255,0.86); }
    .docBody blockquote{
      margin: 10px 0;
      padding: 10px 12px;
      border-left: 3px solid rgba(155,231,255,0.35);
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .error{
      color: rgba(255,160,160,0.95);
      font-size: 13px;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    /* Footer */
    .footer{
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.12);
      text-align:center;
      font-size: 12.5px;
      color: rgba(255,255,255,0.65);
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- Banner -->
    <div class="banner">
      <div class="bannerFrame">
        <!-- Your new banner file -->
        <img src="Vedic_podcast_banner_2.png" alt="Veda Padārtha Anvaya Podcasts">
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="field">
        <label for="textSelect">Vedic Text</label>
        <select id="textSelect"></select>
      </div>

      <div class="field">
        <label for="dateSelect">Date</label>
        <select id="dateSelect"></select>
      </div>

      <div class="toggle">
        <button id="btnTranscription" class="active" type="button">Transcription</button>
        <button id="btnSummary" type="button">Podcast Summary</button>
      </div>
    </div>

    <!-- Status -->
    <div class="statusRow">
      <div class="statusPill" id="statusMsg">Ready.</div>
    </div>

    <!-- AUDIO PLAYER (right below controls) -->
    <div class="card">
      <h2 class="episodeTitle" id="episodeTitle">Select an episode</h2>
      <p class="episodeMeta" id="episodeMeta"></p>

      <video id="audioPlayer" controls playsinline preload="metadata"></video>

      <div class="error" id="audioError" style="display:none;"></div>
    </div>

    <!-- Transcription / Summary (below audio) -->
    <div class="card">
      <div class="docHeader">
        <h3 id="docTitle">Transcription</h3>
      </div>

      <div class="docBody" id="docBody">
        Loading…
      </div>

      <div class="error" id="docError" style="display:none;"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div>
        <strong>Acknowledgements:</strong>
        Shri Ram kumar Vaidyanathan, Portland, OR, USA
      </div>
      <div style="margin-top:4px;">
        <strong>Contact:</strong>
        <a href="mailto:ramk21@gmail.com" style="color:inherit; text-decoration:underline;">
          ramk21@gmail.com
        </a>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
