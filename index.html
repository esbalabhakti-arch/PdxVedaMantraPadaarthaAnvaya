<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Veda Padārtha Anvaya Podcasts</title>

  <!-- DOCX → HTML converter -->
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

  <style>
    :root{
      --bg1:#070914;
      --bg2:#0b1020;
      --card: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --shadow: 0 18px 60px rgba(0,0,0,0.48);
      --radius: 18px;
      --accent: rgba(155,231,255,0.18);
      --toggleBg: rgba(255,255,255,0.06);
      --toggleActive: rgba(255, 215, 140, 0.25);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 20% 10%, rgba(155,231,255,0.18), transparent 58%),
        radial-gradient(900px 600px at 80% 90%, rgba(140,120,255,0.10), transparent 58%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 45%, var(--bg1));
      min-height:100vh;
    }

    .wrap{
      max-width: 1150px;
      margin: 0 auto;
      padding: 18px 16px 50px;
    }

    /* Banner */
    .banner{
      display:flex;
      justify-content:center;
      margin-bottom: 10px;
    }
    .bannerFrame{
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      overflow:hidden;
      background: rgba(255,255,255,0.03);
    }
    .bannerFrame img{
      width: 100%;
      height: 220px;
      object-fit: cover;
      display:block;
    }

    /* Controls layout: LEFT aligned */
    .controlsWrap{
      display:flex;
      flex-direction:column;
      align-items:flex-start; /* key */
      gap:10px;
      margin: 8px 0 8px;
    }

    .controlsRow{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-start; /* key */
      gap:12px;
      width:100%;
    }

    .field{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 12px;
      display:flex;
      gap:10px;
      align-items:center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }

    .field label{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Removed "Vedic Text" label: keep select nicely sized */
    select{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      min-width: 270px;
    }
    select option{ background:#0b1020; }

    /* Toggle row (next line) */
    .toggleRow{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      width:100%;
    }

    .toggleHint{
      font-size: 12.5px;
      color: var(--muted);
      padding-left: 2px;
    }

    .toggle{
      display:flex;
      gap:6px;
      padding: 6px;
      border-radius: 999px;
      background: var(--toggleBg);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 10px 26px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }
    .toggle button{
      border:0;
      padding: 10px 16px;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,0.78);
      cursor:pointer;
      font-size: 13.5px;
      letter-spacing: 0.2px;
    }
    .toggle button.active{
      background: var(--toggleActive);
      color: rgba(255,255,255,0.96);
      box-shadow: inset 0 0 0 1px rgba(255, 215, 140, 0.40);
    }

    /* Status line */
    .statusRow{
      display:flex;
      justify-content:flex-start;  /* align left */
      margin: 2px 0 12px;
      width:100%;
    }
    .statusPill{
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 12.5px;
      max-width: 100%;
    }

    /* Cards */
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    /* Audio section */
    .episodeTitle{
      margin:0 0 6px;
      font-size: 18px;
    }
    .episodeMeta{
      margin:0 0 12px;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    /* <video> used for MP4 reliability */
    #audioPlayer{
      width:100%;
      height: 56px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      outline: none;
    }

    /* Document */
    .docHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom: 10px;
      gap: 10px;
    }
    .docHeader h3{
      margin:0;
      font-size: 16px;
    }

    .docBody{
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px;
      max-height: 55vh;
      overflow:auto;
    }

    .docBody p{ margin:0 0 10px; line-height:1.6; color: rgba(255,255,255,0.88); }
    .docBody h1, .docBody h2, .docBody h3{ margin: 14px 0 10px; }
    .docBody ul{ margin: 8px 0 12px 20px; }
    .docBody li{ margin: 4px 0; color: rgba(255,255,255,0.86); }
    .docBody blockquote{
      margin: 10px 0;
      padding: 10px 12px;
      border-left: 3px solid rgba(155,231,255,0.35);
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .error{
      color: rgba(255,160,160,0.95);
      font-size: 13px;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    /* Footer */
    .footer{
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.12);
      text-align:center;
      font-size: 12.5px;
      color: rgba(255,255,255,0.65);
    }

    /* -------- Mobile fixes -------- */
    @media (max-width: 640px){
      .wrap{ padding: 12px 12px 40px; }

      /* remove heavy frame/shadow that can look like a dark box */
      .bannerFrame{
        border: none;
        box-shadow: none;
        border-radius: 12px;
        background: transparent;
      }
      .bannerFrame img{
        height: 140px;       /* thinner on phone */
        object-fit: cover;
        border-radius: 12px;
      }

      select{ min-width: 240px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- Banner -->
    <div class="banner">
      <div class="bannerFrame">
        <img src="Vedic_podcast_banner_2.png" alt="Veda Padārtha Anvaya Podcasts">
      </div>
    </div>

    <!-- Controls + Toggle (left aligned) -->
    <div class="controlsWrap">

      <div class="controlsRow">
        <!-- No "Vedic Text" label -->
        <div class="field">
          <select id="textSelect" aria-label="Vedic Text"></select>
        </div>

        <!-- Date label becomes Podcast -->
        <div class="field">
          <label for="dateSelect">Podcast</label>
          <select id="dateSelect"></select>
        </div>
      </div>

      <!-- Toggle moved to next line -->
      <div class="toggleRow">
        <div class="toggle">
          <button id="btnTranscription" class="active" type="button">Transcription</button>
          <button id="btnSummary" type="button">Podcast Summary</button>
        </div>
        <div class="toggleHint">
          Tip: Use the toggle to switch between word-by-word/sentence explanation and a short summary.
        </div>
      </div>

      <!-- Status aligned left -->
      <div class="statusRow">
        <div class="statusPill" id="statusMsg">Ready.</div>
      </div>
    </div>

    <!-- AUDIO PLAYER -->
    <div class="card">
      <h2 class="episodeTitle" id="episodeTitle">Select an episode</h2>
      <p class="episodeMeta" id="episodeMeta"></p>
      <video id="audioPlayer" controls playsinline preload="metadata"></video>
      <div class="error" id="audioError" style="display:none;"></div>
    </div>

    <!-- Transcription / Summary -->
    <div class="card">
      <div class="docHeader">
        <h3 id="docTitle">Transcription</h3>
      </div>

      <div class="docBody" id="docBody">Loading…</div>
      <div class="error" id="docError" style="display:none;"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div>
        <strong>Acknowledgements:</strong>
        Shri Ram kumar Vaidyanathan, Portland, OR, USA
      </div>
      <div style="margin-top:4px;">
        <strong>Contact:</strong>
        <a href="mailto:ramk21@gmail.com" style="color:inherit; text-decoration:underline;">
          ramk21@gmail.com
        </a>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
